# Alert rules for the stand (design §2.3). Evaluated by Prometheus; Grafana lists them under
# Alerting -> Alert rules (data-source managed). No Alertmanager: the stand has no receiver.
groups:
  - name: camunda-stand
    rules:
      - alert: CamundaIncidentsPending
        # gauge name on 8.9.21 is zeebe_pending_incidents (no _total) — checked on the live scrape 2026-09-27
        expr: sum(zeebe_pending_incidents) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Unresolved incidents in the Orchestration Cluster"
          description: "{{ $value }} pending incident(s). Triage in Operate; runbook docs/runbooks/incident-handling.md."
      - alert: OrchestrationTargetDown
        expr: up{job="orchestration"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Orchestration Cluster management endpoint is not answering"
          description: "Prometheus cannot scrape orchestration:9600 — check `docker compose ps` and the container log."
