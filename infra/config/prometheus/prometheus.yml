# Prometheus for the stand (monitoring profile, design D6-1). One scrape target: the
# Orchestration Cluster's management port inside the Compose network (not published).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: orchestration
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["orchestration:9600"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
