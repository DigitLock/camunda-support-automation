# Orchestration Cluster configuration with Elasticsearch as secondary storage.
# Structure from configuration/application-opensearch.yaml of the official docker-compose-8.9
# distribution (commit bf243ed), with the secondary-storage type switched to elasticsearch and
# the URL pointing at the elasticsearch Compose service (as in .orchestration/application.yaml).
# Authentication: Basic auth on a protected API with authorizations enabled. Passwords are
# not stored here — Spring resolves the ${...} placeholders from container environment
# variables, which Compose passes in from infra/.env (git-ignored).
camunda:
  backup:
    webapps:
      # web-apps (Operate/Tasklist) backup through POST :9600/actuator/backupHistory
      # (Phase 6.4). The snapshot repository name is camunda.data.backup.repository-name.
      enabled: true
  system:
    cpu-thread-count: "3"
    io-thread-count: "3"
  security:
    authentication:
      method: "basic"
      unprotected-api: false
    authorizations:
      enabled: true
    initialization:
      users:
        - username: "admin"
          password: "${CAMUNDA_ADMIN_PASSWORD}"
          name: "Admin"
          email: "admin@example.com"
        - username: "connectors"
          password: "${CAMUNDA_CONNECTORS_PASSWORD}"
          name: "Connectors"
          email: "connectors@example.com"
      defaultRoles:
        admin:
          users:
            - "admin"
        connectors:
          users:
            - "connectors"
  data:
    # Zeebe partition backup store — 8.9 unified keys, confirmed on the stand 2026-09-27
    # (startup log: FilesystemBackupStore created; GET :9600/actuator/backupRuntime answers
    # a list). The base path is the bind mount in docker-compose.yml and MUST be writable by
    # uid 1001 — a wrong owner leaves partition 1 INACTIVE while the container stays healthy
    # (docs/ops/install.md, Troubleshooting).
    primary-storage:
      backup:
        store: FILESYSTEM
        filesystem:
          base-path: /usr/local/camunda/backup
    secondary-storage:
      type: elasticsearch
      elasticsearch:
        url: http://elasticsearch:9200
        number-of-replicas: 0
        # Elasticsearch snapshot repository used by the web-apps backup (backupHistory).
        # 8.9 key; the docs' camunda.data.backup.repository-name is logged as legacy
        # (observed 2026-09-27). Registered by tests/ops/backup.sh / restore.sh (ensure_repo).
        backup:
          repository-name: camunda
  mcp:
    enabled: true
# Prometheus scrape endpoint on the management port (9600, not published; scraped by the
# monitoring profile). Property names from the 8.9 metrics guide (design D6-1).
management:
  endpoint:
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
