# Core stack: Orchestration Cluster + Connectors + Elasticsearch as secondary storage.
# Derived from the official docker-compose-8.9 distribution (camunda/camunda-distributions,
# commit bf243ed): service wiring and healthchecks from docker-compose.yaml (lightweight) and
# docker-compose-full.yaml (Elasticsearch service, depends_on). Authentication: Basic auth on a
# protected API with authorizations enabled; passwords come from infra/.env (git-ignored) and
# are passed explicitly per service — Compose fails fast if they are missing.
#
# Deviations from the reference, on purpose:
# - No ports published except orchestration 8080 (UI + REST v2). gRPC 26500 and management 9600
#   stay internal; healthchecks reach 9600 inside the container.
# - No camunda-data-init service and no camunda-data volume: both exist only for the file-based
#   H2 database of the lightweight setup, which Elasticsearch secondary storage replaces.
# - No env_file: the mounted application.yaml has no ${...} placeholders, and injecting the
#   whole .env into containers would leak unrelated variables.
# - restart/mem_limit tuned for a dedicated VM instead of a developer laptop.

services:
  orchestration: # Consolidated Zeebe + Operate + Tasklist
    image: camunda/camunda:${CAMUNDA_VERSION}
    container_name: orchestration
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms2g -Xmx2g"
      CAMUNDA_ADMIN_PASSWORD: ${CAMUNDA_ADMIN_PASSWORD:?set CAMUNDA_ADMIN_PASSWORD in infra/.env}
      CAMUNDA_CONNECTORS_PASSWORD: ${CAMUNDA_CONNECTORS_PASSWORD:?set CAMUNDA_CONNECTORS_PASSWORD in infra/.env}
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - camunda:/usr/local/camunda/data
      - ./config/orchestration/application.yaml:/usr/local/camunda/config/application.yaml
    networks:
      - camunda
    depends_on:
      elasticsearch:
        condition: service_healthy

  connectors:
    image: camunda/connectors-bundle:${CAMUNDA_CONNECTORS_VERSION}
    container_name: connectors
    environment:
      CAMUNDA_CLIENT_AUTH_METHOD: basic
      CAMUNDA_CLIENT_AUTH_USERNAME: connectors
      CAMUNDA_CLIENT_AUTH_PASSWORD: ${CAMUNDA_CONNECTORS_PASSWORD:?set CAMUNDA_CONNECTORS_PASSWORD in infra/.env}
      # Since 8.9 the env secret provider only exposes SECRET_-prefixed variables as
      # {{secrets.NAME}} (docs: connectors configuration). Referenced by the v5 model.
      SECRET_FX_BASE_URL: ${FX_BASE_URL}
      SECRET_KAFKA_BOOTSTRAP: kafka:29092
    mem_limit: 1536m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    configs:
      - source: connectors-config
        target: application.yaml
    networks:
      - camunda
    depends_on:
      orchestration:
        # Wait for orchestration to be healthy, otherwise we get noisy connection errors
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: elasticsearch
    environment:
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cat/health?h=status | grep -Eq 'green|yellow'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - elastic:/usr/share/elasticsearch/data
    networks:
      - camunda

  # ---- integrations profile: everything the process depends on (ADR-005..007) ----

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    profiles: ["integrations"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # INTERNAL for connectors/workers inside the compose network, EXTERNAL for
      # clients outside the VM (advertised address comes from STAND_IP in infra/.env;
      # the 127.0.0.1 default keeps the stack bootable without the variable)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${STAND_IP:-127.0.0.1}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9092:9092"
    mem_limit: 1536m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - camunda

  kafka-init: # one-shot: creates the two ticket topics, exits 0
    image: apache/kafka:4.3.1
    container_name: kafka-init
    profiles: ["integrations"]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic support.ticket.created --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic support.ticket.resolved --partitions 1 --replication-factor 1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - camunda

  booking-api:
    build: ../services/booking-api
    image: booking-api:local
    container_name: booking-api
    profiles: ["integrations"]
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      # scratch image: no shell/curl, the binary probes itself
      test: ["CMD", "/app", "-check"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - camunda

  fx:
    build: ../services/fx-gateway
    image: fx-gateway:local
    container_name: fx
    profiles: ["integrations"]
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app", "-check"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - camunda

  postgres: # LLM audit + analytics storage (D5-3, ADR-002 analytics path)
    image: postgres:17.11-alpine
    container_name: postgres
    profiles: ["integrations"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/.env}
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - camunda

  smoke: # own profile so `up` never starts it; `docker compose run --rm --no-deps smoke`
         # activates the profile implicitly
    image: curlimages/curl:8.16.0
    profiles: ["smoke"]
    entrypoint: ["/bin/sh", "/smoke/phase-4-infra.sh"]
    environment:
      SMOKE_IN_CONTAINER: "1"
    volumes:
      - ../tests/smoke:/smoke:ro
    restart: "no"
    networks:
      - camunda

  # ---- workers profile: job workers only (ADR-006). Depends on services from the
  # integrations profile, so always start with BOTH profiles, as make deploy does ----

  worker-booking:
    build: ../workers/booking
    image: worker-booking:local
    container_name: worker-booking
    profiles: ["workers"]
    environment:
      CAMUNDA_BASE_URL: http://orchestration:8080
      CAMUNDA_USER: admin
      CAMUNDA_PASSWORD: ${CAMUNDA_ADMIN_PASSWORD:?set CAMUNDA_ADMIN_PASSWORD in infra/.env}
      BOOKING_API_URL: http://booking-api:8080
    mem_limit: 64m
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/app", "-check"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      orchestration:
        condition: service_healthy
      booking-api:
        condition: service_healthy
    networks:
      - camunda

  worker-llm-classifier:
    build: ../workers/llm-classifier
    image: worker-llm-classifier:local
    container_name: worker-llm-classifier
    profiles: ["workers"]
    env_file:
      - ../workers/llm-classifier/.env
    volumes:
      # versioned system prompts, loaded at runtime by CLASSIFY_PROMPT_VERSION
      - ../prompts:/app/prompts:ro
    environment:
      # overrides the venv-oriented localhost values from the env_file
      CAMUNDA_BASE_URL: http://orchestration:8080
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in infra/.env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in infra/.env}
      LLM_MODEL_CLASSIFY: ${LLM_MODEL_CLASSIFY:-claude-haiku-4-5}
      LLM_MODEL_GENERATE: ${LLM_MODEL_GENERATE:-claude-sonnet-5}
      CLASSIFY_CONFIDENCE_THRESHOLD: ${CLASSIFY_CONFIDENCE_THRESHOLD:-0.8}
      CLASSIFY_PROMPT_VERSION: ${CLASSIFY_PROMPT_VERSION:-classify_v2}
    mem_limit: 256m
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      orchestration:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - camunda

volumes:
  camunda:
  elastic:
  kafka-data:
  postgres-data:

networks:
  camunda:
    name: camunda

configs:
  connectors-config:
    content: |
      camunda:
        client:
          mode: self-managed
          grpc-address: http://orchestration:26500
          rest-address: http://orchestration:8080
      management:
        endpoints:
          web:
            exposure:
              include: health,configprops
        endpoint:
          health:
            probes:
              enabled: true
